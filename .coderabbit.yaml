# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  auto_review:
    # the default branch is always reviewed, these add stacked pull requests on top of it
    base_branches:
      - '^\d+\.\d+$' # release branches such as 1.5
      - feat/schedule
      - feat/scheduler-.*
      - feat/test-boot
      - feat/testing.*
      - feat/client.*
